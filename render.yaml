services:
  - type: web
    name: documind-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: chunk1
      - key: QDRANT_VECTOR_SIZE
        value: 3072
      - key: QDRANT_DISTANCE
        value: Cosine
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGINS
        sync: false
